<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Freela+</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#18202a;font-family:Arial,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:82px}.top{background:#111827;color:#fff;padding:22px 18px 18px;border-radius:0 0 22px 22px}.top .title{font-size:26px;font-weight:800}.top .sub{opacity:.75;margin-top:4px}.content{padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}.dateRow{display:flex;justify-content:space-between;align-items:center;gap:8px}.date{font-size:21px;font-weight:800}.muted{color:#667085;font-size:13px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:#2563eb;color:#fff;cursor:pointer}.btn.secondary{background:#eef2f6;color:#17202a}.btn.danger{background:#dc2626}.btn.green{background:#16a34a}.btn.full{width:100%}.person{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f3}.person:last-child{border-bottom:0}.name{font-weight:800}.type{font-size:11px;color:#667085;margin-top:3px}.status{border:0;border-radius:12px;padding:10px 11px;font-weight:700;min-width:135px;background:#f1f5f9}.status.full{background:#dcfce7;color:#166534}.status.half{background:#fef3c7;color:#92400e}.status.off{background:#f1f5f9;color:#667085}.fab{position:fixed;right:max(18px,calc((100vw - 560px)/2 + 18px));bottom:78px;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 5px 18px #0003}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:center;z-index:5}.navin{max-width:560px;width:100%;display:flex}.nav button{flex:1;border:0;background:#fff;padding:12px 4px 10px;color:#667085;font-size:12px}.nav button.active{color:#2563eb;font-weight:800}.nav .ico{display:block;font-size:20px;margin-bottom:2px}.hidden{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:12px;padding:12px}.metric b{font-size:20px}.select{width:100%;padding:12px;border:1px solid #d5dae0;border-radius:10px;background:#fff;font:inherit}.listrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.listrow:last-child{border:0}.tag{font-size:11px;padding:5px 8px;border-radius:20px;background:#eef2ff}.total{font-size:27px;font-weight:900}.empty{text-align:center;color:#667085;padding:30px 10px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px}.sheet h3{margin:0 0 15px}.sheet button{width:100%;margin-top:8px}.notice{padding:10px 12px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:12px;margin-bottom:10px}.historyItem{cursor:pointer}.printOnly{display:none}@media(min-width:561px){.nav{left:50%;right:auto;transform:translateX(-50%);width:560px}.fab{position:fixed}}
</style></head><body><div class="app"><header class="top"><div class="title">Freela+</div><div class="sub">Controle diário de freelancers</div></header><main class="content">
<section id="daily"><div class="card"><div class="dateRow"><button class="btn secondary" onclick="moveDay(-1)">‹</button><div style="text-align:center"><div id="dayName" class="muted"></div><div id="dayDate" class="date"></div></div><button class="btn secondary" onclick="moveDay(1)">›</button></div><div id="holidayNotice" style="margin-top:10px"></div></div><div class="card"><div class="dateRow"><div><b>Registro do dia</b><div class="muted">Toque no status para alterar</div></div><button class="btn secondary" onclick="goToday()">Hoje</button></div><div id="dailyList"></div></div><button class="btn green full" onclick="showTab('summary')">Ver fechamento da semana</button></section>
<section id="summary" class="hidden"><div class="card"><div class="dateRow"><div><b>Fechamento da semana</b><div id="weekRange" class="muted"></div></div><button class="btn" onclick="savePDF()">📄 Salvar PDF</button></div></div><div id="summaryList"></div></section>
<section id="peopleTab" class="hidden"><div class="card"><b>Freelancers</b><div class="muted" style="margin-top:4px">Escolha a forma de pagamento no cadastro.</div><div id="peopleList"></div></div></section>
<section id="history" class="hidden"><div class="card"><b>Histórico</b><div class="muted">Semanas já registradas</div><div id="historyList"></div></div></section>
</main><button class="btn fab" onclick="addPerson()">＋</button><nav class="nav"><div class="navin"><button id="navDaily" class="active" onclick="showTab('daily')"><span class="ico">📅</span>Hoje</button><button id="navSummary" onclick="showTab('summary')"><span class="ico">💰</span>Fechamento</button><button id="navPeople" onclick="showTab('peopleTab')"><span class="ico">👥</span>Freelancers</button><button id="navHistory" onclick="showTab('history')"><span class="ico">📚</span>Histórico</button></div></nav></div><div id="modal"></div>
<script>
const KEY='freelaPlusDailyV1';const defaultHolidays={'2026-01-01':'Confraternização Universal','2026-04-03':'Sexta-feira Santa','2026-04-21':'Tiradentes','2026-05-01':'Dia do Trabalho','2026-06-04':'Corpus Christi','2026-07-09':'Revolução Constitucionalista','2026-07-26':'Nossa Senhora de Sant’Ana','2026-09-01':'Aniversário de Mogi das Cruzes','2026-09-07':'Independência do Brasil','2026-10-12':'Nossa Senhora Aparecida','2026-11-02':'Finados','2026-11-15':'Proclamação da República','2026-11-20':'Consciência Negra','2026-12-25':'Natal'};
let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){data=null}if(!data)data={people:[],records:{},holidays:defaultHolidays};data.people=Array.isArray(data.people)?data.people:[];data.records=data.records||{};data.holidays=data.holidays||defaultHolidays;let current=new Date();current.setHours(12,0,0,0);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function iso(d){return new Date(d).toISOString().slice(0,10)}function parse(s){return new Date(s+'T12:00:00')}function monday(d){let x=new Date(d);let n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));return x}function fmt(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}function dayName(d){return d.toLocaleDateString('pt-BR',{weekday:'long'})}function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function rate(p,d,state){if(state==='off')return 0;let base=p.rate150?150:((d.getDay()===0||d.getDay()===6||data.holidays[iso(d)])?150:120);return state==='half'?base/2:base}function get(p,d){return data.records[p.id+'_'+iso(d)]||'off'}function set(p,d,s){let k=p.id+'_'+iso(d);if(s==='off')delete data.records[k];else data.records[k]=s;save();render()}
function addPerson(){let n=prompt('Nome do freelancer:');if(!n||!n.trim())return;let choice=prompt('Forma de pagamento:\n1 - Normal (R$ 120 seg-sex / R$ 150 sáb-dom-feriado)\n2 - R$ 150 todos os dias','1');if(choice!=='1'&&choice!=='2')return alert('Cadastro cancelado. Escolha 1 ou 2.');data.people.push({id:'p'+Date.now()+Math.random().toString(36).slice(2),name:n.trim(),rate150:choice==='2'});save();render();showTab('peopleTab')}
function removePerson(id){let p=data.people.find(x=>x.id===id);if(!p)return;if(!confirm('Excluir freelancer?\n\nTem certeza que deseja excluir '+p.name+'?\n\nOs registros desse freelancer também serão apagados.'))return;data.people=data.people.filter(x=>x.id!==id);Object.keys(data.records).forEach(k=>{if(k.startsWith(id+'_'))delete data.records[k]});save();render()}
function moveDay(n){current.setDate(current.getDate()+n);render()}function goToday(){current=new Date();current.setHours(12,0,0,0);render()}
function render(){renderDaily();renderSummary();renderPeople();renderHistory()}
function renderDaily(){document.getElementById('dayName').textContent=dayName(current);document.getElementById('dayDate').textContent=current.toLocaleDateString('pt-BR');let h=data.holidays[iso(current)];document.getElementById('holidayNotice').innerHTML=h?'<div class="notice">🎉 Feriado: '+h+' — trabalho integral paga R$ 150 (ou R$ 150 no tipo todos os dias).</div>':'';let el=document.getElementById('dailyList');if(!data.people.length){el.innerHTML='<div class="empty">Nenhum freelancer cadastrado.<br><br>Toque no botão ＋ para adicionar.</div>';return}el.innerHTML=data.people.map(p=>{let s=get(p,current),label=s==='full'?'Integral':s==='half'?'Meio período':'Não trabalhou';return '<div class="person"><div><div class="name">'+p.name+'</div><div class="type">'+(p.rate150?'R$ 150 todos os dias':'R$ 120 seg-sex / R$ 150 sáb-dom-feriado')+'</div></div><button class="status '+s+'" onclick="cycle(\''+p.id+'\')">'+label+'</button></div>'}).join('')}
function cycle(id){let p=data.people.find(x=>x.id===id),s=get(p,current);set(p,current,s==='off'?'half':s==='half'?'full':'off')}
function weekDates(ref){let s=monday(ref);return Array.from({length:7},(_,i)=>{let d=new Date(s);d.setDate(s.getDate()+i);return d})}function personTotal(p,ds){return ds.reduce((a,d)=>a+rate(p,d,get(p,d)),0)}function weekTotal(ds){return data.people.reduce((a,p)=>a+personTotal(p,ds),0)}
function renderSummary(){let ds=weekDates(current);document.getElementById('weekRange').textContent=fmt(ds[0])+' a '+fmt(ds[6]);let el=document.getElementById('summaryList');if(!data.people.length){el.innerHTML='<div class="card empty">Nenhum freelancer cadastrado.</div>';return}el.innerHTML=data.people.map(p=>{let total=personTotal(p,ds),full=ds.filter(d=>get(p,d)==='full').length,half=ds.filter(d=>get(p,d)==='half').length;return '<div class="card"><div class="dateRow"><div><b>'+p.name+'</b><div class="muted">'+full+' integral · '+half+' meio período</div></div><div class="total">'+money(total)+'</div></div></div>'}).join('')+'<div class="card"><div class="muted">TOTAL GERAL</div><div class="total">'+money(weekTotal(ds))+'</div></div>'}
function renderPeople(){document.getElementById('peopleList').innerHTML=data.people.length?data.people.map(p=>'<div class="listrow"><div><b>'+p.name+'</b><div class="muted">'+(p.rate150?'R$ 150 todos os dias':'R$ 120 seg-sex / R$ 150 sáb-dom-feriado')+'</div></div><button class="btn danger" onclick="removePerson(\''+p.id+'\')">Excluir</button></div>').join(''):'<div class="empty">Nenhum freelancer.</div>'}
function renderHistory(){let el=document.getElementById('historyList'),weeks={};Object.keys(data.records).forEach(k=>{let d=k.split('_').pop();let m=iso(monday(parse(d)));weeks[m]=true});let arr=Object.keys(weeks).sort().reverse();el.innerHTML=arr.length?arr.map(w=>{let ds=weekDates(parse(w));return '<div class="listrow historyItem" onclick="current=parse(\''+w+'\');showTab(\'summary\');render()"><div><b>Semana '+fmt(ds[0])+' a '+fmt(ds[6])+'</b><div class="muted">Total: '+money(weekTotal(ds))+'</div></div><span>›</span></div>'}).join(''):'<div class="empty">Ainda não há semanas no histórico.</div>'}
function showTab(t){['daily','summary','peopleTab','history'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));['Daily','Summary','People','History'].forEach(x=>{let b=document.getElementById('nav'+x);if(b)b.classList.remove('active')});let map={daily:'navDaily',summary:'navSummary',peopleTab:'navPeople',history:'navHistory'};document.getElementById(map[t]).classList.add('active');render()}
function pdfEsc(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').replace(/[\\()]/g,'\\$&')}
function savePDF(){let ds=weekDates(current),lines=['FECHAMENTO DE FREELANCERS','Semana: '+fmt(ds[0])+' a '+fmt(ds[6]),''];data.people.forEach(p=>{let full=ds.filter(d=>get(p,d)==='full').length,half=ds.filter(d=>get(p,d)==='half').length;lines.push(p.name+' - '+full+' integral(is), '+half+' meio periodo(s) - '+money(personTotal(p,ds)))});lines.push('','TOTAL GERAL: '+money(weekTotal(ds)));let stream='BT\n/F1 16 Tf\n42 800 Td\n';lines.forEach((l,i)=>{if(i===1)stream+='/F1 11 Tf\n';stream+='('+pdfEsc(l)+') Tj\n0 -18 Td\n'});stream+='ET';let objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'];let pdf='%PDF-1.4\n',off=[0];objs.forEach((o,i)=>{off.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});let x=pdf.length;pdf+='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<off.length;i++)pdf+=String(off[i]).padStart(10,'0')+' 00000 n \n';pdf+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';let a=document.createElement('a'),blob=new Blob([pdf],{type:'application/pdf'});a.href=URL.createObjectURL(blob);a.download='Fechamento_Freelancers_'+iso(ds[0])+'_a_'+iso(ds[6])+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script></body></html>
