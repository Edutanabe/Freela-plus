<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Freela+</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:Arial,sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}.top{background:#172033;color:#fff;padding:20px 18px 16px;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:24px}.top p{margin:5px 0 0;opacity:.8;font-size:14px}
main{padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #00000012}
h2{margin:0 0 12px;font-size:18px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,input,textarea,select{font:inherit;border-radius:10px;border:1px solid #d0d5dd;padding:10px}
button{border:0;background:#246bfe;color:#fff;cursor:pointer}.secondary{background:#eef2f6;color:#172033}.danger{background:#d92d20}
.day{font-size:18px;font-weight:bold}.muted{color:#667085;font-size:13px}.person{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee}
.person:last-child{border-bottom:0}.name{font-weight:700}.amount{font-weight:700}.status{font-size:12px;padding:5px 8px;border-radius:99px;background:#eef2ff;margin-left:7px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:10}.bottom-inner{max-width:720px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.nav{background:#fff;color:#667085;border-radius:0;padding:9px 2px;font-size:11px}.nav.active{color:#246bfe;font-weight:bold}
.hidden{display:none}.total{font-size:24px;font-weight:800}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:18px 18px 0 0;padding:20px}.sheet h3{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:13px;margin-bottom:5px;color:#667085}.field input,.field textarea,.field select{width:100%}
.weekrow{display:flex;justify-content:space-between;align-items:center}.smallbtn{padding:8px 10px}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>Freela+</h1><p id="subtitle">Registro diário</p></header>
<main>
<section id="today">
<div class="card">
<div class="weekrow"><button class="secondary smallbtn" onclick="shiftDay(-1)">‹</button><div style="text-align:center"><div class="day" id="dateTitle"></div><div class="muted" id="weekTitle"></div></div><button class="secondary smallbtn" onclick="shiftDay(1)">›</button></div>
</div>
<div class="card"><h2>Registros de hoje</h2><div id="dailyList"></div></div>
</section>

<section id="closing" class="hidden">
<div class="card"><div class="weekrow"><button class="secondary smallbtn" onclick="shiftWeek(-7)">‹</button><div style="text-align:center"><h2 style="margin:0">Fechamento</h2><div class="muted" id="closingWeek"></div></div><button class="secondary smallbtn" onclick="shiftWeek(7)">›</button></div></div>
<div class="card"><div id="closingList"></div><div style="border-top:1px solid #eee;padding-top:14px;margin-top:8px"><div class="muted">Total geral</div><div class="total" id="grandTotal"></div></div></div>
</section>

<section id="peopleTab" class="hidden">
<div class="card"><div class="row" style="justify-content:space-between"><h2>Freelancers</h2><button onclick="addPerson()">＋ Adicionar</button></div><div id="peopleList"></div></div>
</section>

<section id="holidays" class="hidden">
<div class="card"><div class="row" style="justify-content:space-between"><h2>Feriados</h2><button onclick="addHoliday()">＋ Adicionar</button></div><p class="muted">Feriados de Mogi das Cruzes já cadastrados para 2026 a 2030.</p><div id="holidayList"></div></div>
</section>

<section id="history" class="hidden">
<div class="card"><h2>Histórico</h2><div id="historyList"></div></div>
</section>
</main>
<nav class="bottom"><div class="bottom-inner">
<button class="nav active" onclick="showTab('today',this)">📅<br>Hoje</button>
<button class="nav" onclick="showTab('closing',this)">💰<br>Fechamento</button>
<button class="nav" onclick="showTab('peopleTab',this)">👥<br>Freelancers</button>
<button class="nav" onclick="showTab('holidays',this)">🎉<br>Feriados</button>
<button class="nav" onclick="showTab('history',this)">📚<br>Histórico</button>
</div></nav>
</div>

<div class="modal" id="modal"><div class="sheet">
<h3 id="modalTitle"></h3><div id="modalBody"></div><div class="row" style="justify-content:flex-end;margin-top:15px"><button class="secondary" onclick="closeModal()">Cancelar</button><button onclick="saveModal()">Salvar</button></div>
</div></div>

<script>
const KEY='freelaPlusFinalV2';
const names=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function key(d){return new Date(d).toISOString().slice(0,10)}
function monday(d){let x=new Date(d),n=x.getDay();x.setDate(x.getDate()-(n===0?6:n-1));x.setHours(12,0,0,0);return x}
function fmt(d){return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
let holidays={};
for(let y=2026;y<=2030;y++){
 const e=easter(y);
 [[`${y}-01-01`,'Confraternização Universal'],[key(addDays(e,-2)),'Sexta-feira Santa'],[`${y}-04-21`,'Tiradentes'],[`${y}-05-01`,'Dia do Trabalho'],[key(addDays(e,60)),'Corpus Christi'],[`${y}-07-09`,'Data Magna de São Paulo'],[`${y}-07-26`,'Nossa Senhora de Sant’Ana'],[`${y}-09-01`,'Aniversário de Mogi das Cruzes'],[`${y}-09-07`,'Independência do Brasil'],[`${y}-10-12`,'Nossa Senhora Aparecida'],[`${y}-11-02`,'Finados'],[`${y}-11-15`,'Proclamação da República'],[`${y}-11-20`,'Consciência Negra'],[`${y}-12-25`,'Natal']].forEach(([d,n])=>holidays[d]=n);
}
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{people:[],records:{},adjust:{},holidays:{}};
Object.keys(holidays).forEach(k=>{if(!data.holidays[k])data.holidays[k]=holidays[k]});
if(!data.people.length)data.people=[{id:'p1',name:'Freelancer 1',rate150:false}];
let selectedDate=new Date(); let closingDate=monday(new Date()); let modalState=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function getRec(pid,d){return data.records[pid+'_'+key(d)]||'off'}
function setRec(pid,d,v){let k=pid+'_'+key(d);if(v==='off')delete data.records[k];else data.records[k]=v;save();render()}
function baseRate(p,d){let weekend=d.getDay()===0||d.getDay()===6||data.holidays[key(d)];return p.rate150?150:(weekend?150:120)}
function amount(p,d){let s=getRec(p.id,d);return s==='full'?baseRate(p,d):s==='half'?baseRate(p,d)/2:0}
function weekDates(start){return Array.from({length:7},(_,i)=>addDays(start,i))}
function weekBase(p,start){return weekDates(start).reduce((a,d)=>a+amount(p,d),0)}
function adj(p,start){return data.adjust[p.id+'_'+key(start)]||{bonus:0,discount:0,obs:''}}
function finalAmount(p,start){let a=adj(p,start);return weekBase(p,start)+(Number(a.bonus)||0)-(Number(a.discount)||0)}
function render(){renderToday();renderPeople();renderClosing();renderHolidays();renderHistory()}
function renderToday(){document.getElementById('dateTitle').textContent=names[selectedDate.getDay()]+' '+fmt(selectedDate);document.getElementById('weekTitle').textContent='Semana '+fmt(monday(selectedDate))+' a '+fmt(addDays(monday(selectedDate),6));document.getElementById('subtitle').textContent='Registro diário';let el=document.getElementById('dailyList');el.innerHTML=data.people.map(p=>{let s=getRec(p.id,selectedDate),label=s==='full'?'Integral':s==='half'?'Meio período':'Não trabalhou';return `<div class="person"><div><span class="name">${esc(p.name)}</span><span class="status">${label}</span></div><button onclick="cycle('${p.id}')">${label}</button></div>`}).join('')}
function cycle(id){let s=getRec(id,selectedDate);setRec(id,selectedDate,s==='off'?'half':s==='half'?'full':'off')}
function renderPeople(){document.getElementById('peopleList').innerHTML=data.people.map(p=>`<div class="person"><div><span class="name">${esc(p.name)}</span><div class="muted">${p.rate150?'R$ 150 todos os dias':'R$ 120 seg-sex / R$ 150 sáb-dom-feriados'}</div></div><div class="row"><button class="secondary" onclick="editPerson('${p.id}')">Editar</button><button class="danger" onclick="removePerson('${p.id}')">Excluir</button></div></div>`).join('')}
function renderClosing(){let start=closingDate;document.getElementById('closingWeek').textContent=fmt(start)+' a '+fmt(addDays(start,6));let list=document.getElementById('closingList');list.innerHTML=data.people.map(p=>`<div class="person" onclick="editAdjustment('${p.id}')"><div class="name">${esc(p.name)}</div><div class="amount">${money(finalAmount(p,start))}</div></div>`).join('')||'<div class="muted">Nenhum freelancer cadastrado.</div>';document.getElementById('grandTotal').textContent=money(data.people.reduce((t,p)=>t+finalAmount(p,start),0))}
function renderHolidays(){document.getElementById('holidayList').innerHTML=Object.entries(data.holidays).sort().map(([d,n])=>`<div class="person"><div><b>${fmt(new Date(d+'T12:00:00'))}</b><div class="muted">${esc(n)}</div></div><button class="danger" onclick="delHoliday('${d}')">Excluir</button></div>`).join('')}
function renderHistory(){let weeks=new Set();Object.keys(data.adjust).forEach(k=>weeks.add(k.split('_').slice(1).join('_')));Object.keys(data.records).forEach(k=>weeks.add(key(monday(new Date(k.split('_').slice(1).join('_')+'T12:00:00')))));let arr=[...weeks].filter(Boolean).sort().reverse().slice(0,20);document.getElementById('historyList').innerHTML=arr.map(d=>`<div class="person"><span>${fmt(new Date(d+'T12:00:00'))} a ${fmt(addDays(new Date(d+'T12:00:00'),6))}</span><button class="secondary" onclick="closingDate=new Date('${d}T12:00:00');showTab('closing',document.querySelectorAll('.nav')[1])">Abrir</button></div>`).join('')||'<div class="muted">Ainda não há semanas anteriores.</div>'}
function addPerson(){let n=prompt('Nome do freelancer:');if(!n||!n.trim())return;let c=prompt('Forma de pagamento:\\n1 - R$ 120 seg-sex / R$ 150 sáb-dom-feriados\\n2 - R$ 150 todos os dias','1');if(c!=='1'&&c!=='2')return;data.people.push({id:'p'+Date.now(),name:n.trim(),rate150:c==='2'});save();render()}
function editPerson(id){let p=data.people.find(x=>x.id===id);if(!p)return;let n=prompt('Nome do freelancer:',p.name);if(n===null)return;let c=prompt('Forma de pagamento:\\n1 - R$ 120 seg-sex / R$ 150 sáb-dom-feriados\\n2 - R$ 150 todos os dias',p.rate150?'2':'1');if(c!=='1'&&c!=='2')return;p.name=n.trim()||p.name;p.rate150=c==='2';save();render()}
function removePerson(id){let p=data.people.find(x=>x.id===id);if(!p)return;if(!confirm('Excluir freelancer?\\n\\nTem certeza que deseja excluir '+p.name+'?'))return;data.people=data.people.filter(x=>x.id!==id);Object.keys(data.records).forEach(k=>{if(k.startsWith(id+'_'))delete data.records[k]});Object.keys(data.adjust).forEach(k=>{if(k.startsWith(id+'_'))delete data.adjust[k]});save();render()}
function editAdjustment(id){let p=data.people.find(x=>x.id===id),a=adj(p,closingDate);modalState={type:'adjust',id};document.getElementById('modalTitle').textContent=p.name;document.getElementById('modalBody').innerHTML=`<div class="field"><label>Valor da semana</label><input disabled value="${money(weekBase(p,closingDate))}"></div><div class="field"><label>Bônus (+)</label><input id="mBonus" type="number" step="0.01" value="${a.bonus||0}"></div><div class="field"><label>Desconto (-)</label><input id="mDiscount" type="number" step="0.01" value="${a.discount||0}"></div><div class="field"><label>Observações</label><textarea id="mObs" rows="4">${esc(a.obs||'')}</textarea></div>`;document.getElementById('modal').classList.add('open')}
function saveModal(){if(!modalState)return;if(modalState.type==='adjust'){data.adjust[modalState.id+'_'+key(closingDate)]={bonus:Number(document.getElementById('mBonus').value)||0,discount:Number(document.getElementById('mDiscount').value)||0,obs:document.getElementById('mObs').value};save();closeModal();renderClosing()}else if(modalState.type==='holiday'){let d=document.getElementById('mDate').value,n=document.getElementById('mName').value.trim();if(d&&n)data.holidays[d]=n;save();closeModal();renderHolidays()}}
function addHoliday(){modalState={type:'holiday'};document.getElementById('modalTitle').textContent='Adicionar feriado';document.getElementById('modalBody').innerHTML='<div class="field"><label>Data</label><input id="mDate" type="date"></div><div class="field"><label>Nome</label><input id="mName"></div>';document.getElementById('modal').classList.add('open')}
function delHoliday(d){if(confirm('Excluir este feriado?')){delete data.holidays[d];save();renderHolidays()}}
function closeModal(){document.getElementById('modal').classList.remove('open');modalState=null}
function shiftDay(n){selectedDate=addDays(selectedDate,n);renderToday()}
function shiftWeek(n){closingDate=addDays(closingDate,n);renderClosing()}
function showTab(id,btn){['today','closing','peopleTab','holidays','history'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
render();
</script>
</body>
</html>
